<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07110e" />
  <title>NEXA-SAVER — offline</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: #07110e; color: #e9f5ef; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .hex { width: 64px; height: 64px; margin: 0 auto 20px; background: #3fd08f; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #9bb3a8; max-width: 28ch; line-height: 1.5; }
    button { font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 10px; background: #3fd08f; color: #07110e; }
  </style>
</head>
<body>
  <main>
    <div class="hex" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>NEXA-SAVER needs a connection to show your vault safely. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
